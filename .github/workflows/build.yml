name: Build and Release APK

# Repo me source.zip push / upload hote hi build chalta hai. Version khud badhta hai (pichle release + 1).
# Haath se chalana ho to Actions > Run workflow (version khali chhodo = auto, ya khud likho).
on:
  push:
    branches: [main, master]
    paths: ["source.zip"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version (khali = auto: pichle release + 1)"
        required: false
        default: ""
      notes:
        description: "Changelog (chhota sa)"
        required: false
        default: "Bug fixes"

concurrency:
  group: build-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version rule: pichle release x.y.z -> x.y.(z+1). z 20 se upar nahi jata: 1.4.20 ke baad 1.5.1
      - name: Version nikalo
        env:
          GH_TOKEN: ${{ github.token }}
          IN_VER: ${{ inputs.version }}
          IN_NOTES: ${{ inputs.notes }}
        run: |
          MAXPATCH=20
          if [ -n "$IN_VER" ]; then
            VER="$IN_VER"
          else
            PREV=$(gh release view --json tagName -q .tagName 2>/dev/null || echo "")
            PREV="${PREV#v}"
            if [[ "$PREV" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              MAJ=${BASH_REMATCH[1]}; MIN=${BASH_REMATCH[2]}; PAT=${BASH_REMATCH[3]}
              if [ "$PAT" -ge "$MAXPATCH" ]; then MIN=$((MIN + 1)); PAT=1; else PAT=$((PAT + 1)); fi
              VER="$MAJ.$MIN.$PAT"
            else
              echo "::warning::Pichla release x.y.z format me nahi mila ('$PREV'), 1.0.1 se shuru"
              VER="1.0.1"
            fi
          fi
          # Changelog: haath se chalaya to jo likha wahi, warna (push par) hamesha "Bug fixes".
          # Commit message use nahi hota (GitHub web upload ka message "Add files via upload" hota hai).
          NOTES="${IN_NOTES:-}"
          [ -z "$NOTES" ] && NOTES="Bug fixes"
          echo "Naya version: $VER"
          echo "VER=$VER" >> "$GITHUB_ENV"
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      - name: Source zip kholo
        run: |
          unzip -q source.zip -d src_tmp
          DIR=$(dirname "$(find src_tmp -maxdepth 3 -name settings.gradle.kts | head -1)")
          echo "PROJ=$DIR" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Signing key lagao
        env:
          KS_B64: ${{ secrets.KS_B64 }}
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          echo "$KS_B64" | base64 -d > "$PROJ/nextgen-release.jks"
          # key ka alias keystore se hi padh lete hain (secret ya file me alias likhne ki zaroorat nahi)
          ALIAS=$(keytool -list -keystore "$PROJ/nextgen-release.jks" -storepass "$KS_PASS" 2>/dev/null | awk -F', ' '/PrivateKeyEntry/ {print $1; exit}')
          if [ -z "$ALIAS" ]; then echo "Keystore me key alias nahi mila (KS_B64 / KS_PASS check karo)"; exit 1; fi
          printf 'storeFile=nextgen-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KS_PASS" "$ALIAS" "$KS_PASS" > "$PROJ/keystore.properties"

      # LGPL FFmpeg audio decoders (AC3/EAC3/DTS/TrueHD...). Ek baar banta hai, phir cache se aata hai.
      # Fail ho to bhi build chalta hai (bas ye audio formats phone ke decoder par depend karenge).
      - name: FFmpeg LGPL AAR cache
        id: ffcache
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJ }}/app/libs/media3-decoder-ffmpeg-lgpl.aar
          key: ffmpeg-lgpl-media3-1.8.0-n6.0-v1

      - name: FFmpeg LGPL AAR banao
        if: steps.ffcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          mkdir -p "$PROJ/app/libs"
          bash "$PROJ/tools/build_ffmpeg_lgpl.sh" "$PROJ/app/libs/media3-decoder-ffmpeg-lgpl.aar"

      - name: APK build
        env:
          VER: ${{ env.VER }}
        working-directory: ${{ env.PROJ }}
        run: gradle assembleRelease --no-daemon -PverCode=$((GITHUB_RUN_NUMBER + 10)) -PverName="$VER"

      - name: Check (FFmpeg APK me aaya ya nahi)
        run: |
          APK="$PROJ/app/build/outputs/apk/release/app-release.apk"
          unzip -l "$APK" | grep -q "libffmpegJNI.so" && echo "FFmpeg (LGPL): ha" || echo "::warning::FFmpeg AAR APK me nahi hai (audio sirf phone decoders se)"

      - name: APK file taiyar karo
        env:
          VER: ${{ env.VER }}
        run: cp "$PROJ/app/build/outputs/apk/release/app-release.apk" "NextGenPlay-$VER.apk"

      # Pichle release se naye APK ka chhota patch. Fail ho (ya pehla release ho) to bhi release chalta hai, bas poora APK jayega.
      - name: Patch banao (pichle release se)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ env.VER }}
        run: |
          set -e
          sudo apt-get install -y bsdiff > /dev/null
          PREV=$(gh release view --json tagName -q .tagName)
          mkdir prev
          gh release download "$PREV" --dir prev --pattern 'NextGenPlay-*.apk' --pattern 'version.json'
          OLD=$(ls prev/NextGenPlay-*.apk | head -1)
          PCODE=$(jq -r .versionCode prev/version.json)
          bsdiff "$OLD" "NextGenPlay-$VER.apk" raw.bsdiff
          PF="NextGenPlay-$PCODE-to-$VER.patch"
          python3 "$PROJ/tools/pack-patch.py" raw.bsdiff "$PF"
          APK_SIZE=$(stat -c%s "NextGenPlay-$VER.apk")
          PATCH_SIZE=$(stat -c%s "$PF")
          if [ $((PATCH_SIZE * 10)) -gt $((APK_SIZE * 8)) ]; then
            echo "Patch bada hai ($PATCH_SIZE / $APK_SIZE), skip"
            rm -f "$PF"
          else
            echo "PATCH_FILE=$PF" >> "$GITHUB_ENV"
            echo "PATCH_FROM=$PCODE" >> "$GITHUB_ENV"
          fi

      - name: version.json banao
        env:
          VER: ${{ env.VER }}
          NOTES: ${{ env.NOTES }}
        run: |
          SHA=$(sha256sum "NextGenPlay-$VER.apk" | cut -d' ' -f1)
          SIZE=$(stat -c%s "NextGenPlay-$VER.apk")
          BASE="https://github.com/${{ github.repository }}/releases/download/v$VER"
          jq -n --argjson code $((GITHUB_RUN_NUMBER + 10)) --arg name "$VER" \
            --arg url "$BASE/NextGenPlay-$VER.apk" \
            --arg sha "$SHA" --argjson size "$SIZE" --arg log "$NOTES" \
            '{versionCode:$code, versionName:$name, apkUrl:$url, sha256:$sha, sizeBytes:$size, changelog:$log}' > version.json
          if [ -n "${PATCH_FILE:-}" ] && [ -f "$PATCH_FILE" ]; then
            PSHA=$(sha256sum "$PATCH_FILE" | cut -d' ' -f1)
            PSIZE=$(stat -c%s "$PATCH_FILE")
            jq --arg url "$BASE/$PATCH_FILE" --argjson from "$PATCH_FROM" --argjson size "$PSIZE" --arg sha "$PSHA" \
              '. + {patch:{url:$url, fromCode:$from, sizeBytes:$size, sha256:$sha}}' version.json > version.tmp
            mv version.tmp version.json
          fi
          cat version.json

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ env.VER }}
          NOTES: ${{ env.NOTES }}
        run: |
          ASSETS=("NextGenPlay-$VER.apk" version.json)
          if [ -n "${PATCH_FILE:-}" ] && [ -f "$PATCH_FILE" ]; then ASSETS+=("$PATCH_FILE"); fi
          gh release create "v$VER" "${ASSETS[@]}" --title "NextGen Play v$VER" --notes "$NOTES" --latest
